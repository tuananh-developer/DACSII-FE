<div class="relative">
  <!-- Bell Button -->
  <button (click)="toggleDropdown()" class="relative p-2 rounded-full hover:bg-[#f6f9fc] transition-colors focus:outline-none">
    <svg viewBox="0 0 32 32" class="w-6 h-6 fill-none stroke-[#0d253d] stroke-2"><path d="M16 4a7 7 0 0 0-7 7v7l-3 4h20l-3-4v-7a7 7 0 0 0-7-7zM12 24a4 4 0 0 0 8 0z"></path></svg>
    <!-- Badge -->
    <span *ngIf="unreadCount() > 0" class="absolute top-1 right-1 w-4 h-4 bg-[#ea2261] text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white shadow-sm">
      {{ unreadCount() > 9 ? '9+' : unreadCount() }}
    </span>
  </button>

  <!-- Dropdown Panel (Clean/Strike Style) -->
  <div *ngIf="isOpen()" @dropdownAnimation class="absolute right-0 mt-2 w-[380px] bg-white border border-[#e3e8ee] shadow-[0_8px_24px_rgba(0,55,112,0.12)] rounded-[16px] overflow-hidden z-[100] origin-top-right text-[#0d253d] font-sans">
    
    <div class="flex items-center justify-between p-4 border-b border-[#e3e8ee] bg-[#f6f9fc]">
      <h3 class="text-[16px] font-semibold tracking-tight">Thông báo</h3>
      <button *ngIf="unreadCount() > 0" (click)="markAllAsRead()" class="text-[13px] text-[#533afd] hover:text-[#4434d4] font-medium transition-colors">Đánh dấu đã đọc tất cả</button>
    </div>

    <div class="max-h-[400px] overflow-y-auto hide-scrollbar">
      
      <div *ngIf="notifications().length === 0" class="p-8 text-center">
        <div class="w-12 h-12 bg-[#f6f9fc] rounded-full flex items-center justify-center mx-auto mb-3 border border-[#e3e8ee]">
          <svg viewBox="0 0 32 32" class="w-6 h-6 fill-none stroke-[#64748d] stroke-2"><path d="M16 4a7 7 0 0 0-7 7v7l-3 4h20l-3-4v-7a7 7 0 0 0-7-7zM12 24a4 4 0 0 0 8 0z"></path></svg>
        </div>
        <p class="text-[14px] text-[#64748d]">Bạn chưa có thông báo nào.</p>
      </div>

      <div *ngFor="let notif of notifications()" 
           class="flex gap-4 p-4 border-b border-[#e3e8ee] hover:bg-[#f8fafc] transition-colors cursor-pointer relative group"
           [ngClass]="!notif.isRead ? 'bg-[#f0f4f8]' : 'bg-white'">
        
        <!-- Icon logic using ngSwitch -->
        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 shadow-[inset_0_0_0_1px_rgba(0,0,0,0.05)]"
             [ngClass]="{
               'bg-[#dcfce7]': notif.type === 'BOOKING_SUCCESS',
               'bg-[#fef9c3]': notif.type === 'REMINDER',
               'bg-[#fee2e2]': notif.type === 'CANCELLED',
               'bg-[#e0e7ff]': notif.type === 'SYSTEM'
             }"
             [ngSwitch]="notif.type">
          
          <svg *ngSwitchCase="'BOOKING_SUCCESS'" viewBox="0 0 32 32" class="w-5 h-5 fill-[#166534]"><path d="M12.7 26a1 1 0 0 1-.7-.3l-8-8a1 1 0 0 1 1.4-1.4l7.3 7.3L26.6 6.3a1 1 0 0 1 1.4 1.4l-14.6 18a1 1 0 0 1-.7.3z"></path></svg>
          <svg *ngSwitchCase="'REMINDER'" viewBox="0 0 32 32" class="w-5 h-5 fill-[#854d0e]"><path d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm0 26a12 12 0 1 1 12-12 12 12 0 0 1-12 12z"></path><path d="M17 8h-2v9h8v-2h-6z"></path></svg>
          <svg *ngSwitchCase="'CANCELLED'" viewBox="0 0 32 32" class="w-5 h-5 fill-[#991b1b]"><path d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm0 26a12 12 0 1 1 12-12 12 12 0 0 1-12 12z"></path><path d="M21.4 10.6l-1.4-1.4L16 13.2l-4-4-1.4 1.4 4 4-4 4 1.4 1.4 4-4 4 4 1.4-1.4-4-4z"></path></svg>
          <svg *ngSwitchDefault viewBox="0 0 32 32" class="w-5 h-5 fill-[#3730a3]"><path d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm0 26a12 12 0 1 1 12-12 12 12 0 0 1-12 12z"></path><circle cx="16" cy="16" r="3"></circle></svg>

        </div>
        
        <div class="flex-1 pr-6">
          <h4 class="text-[14px] font-medium mb-0.5 line-clamp-1" [ngClass]="!notif.isRead ? 'text-[#0d253d]' : 'text-[#475569]'">{{ notif.title }}</h4>
          <p class="text-[13px] line-clamp-2 leading-relaxed" [ngClass]="!notif.isRead ? 'text-[#334155]' : 'text-[#64748d]'">{{ notif.message }}</p>
          <span class="text-[12px] text-[#94a3b8] mt-1.5 block tabular-nums">{{ notif.createdAt | date:'short' }}</span>
        </div>

        <button *ngIf="!notif.isRead" (click)="markAsRead(notif.id, $event)" class="absolute right-4 top-4 w-2.5 h-2.5 bg-[#533afd] rounded-full hover:scale-125 transition-transform" title="Đánh dấu đã đọc"></button>
      </div>
    </div>
    
    <div class="p-3 text-center border-t border-[#e3e8ee] bg-[#f8fafc] hover:bg-[#f1f5f9] cursor-pointer transition-colors">
      <span class="text-[13px] font-medium text-[#0d253d]">Xem tất cả thông báo</span>
    </div>
  </div>
</div>
