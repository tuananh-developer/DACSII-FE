<div class="relative">
  <!-- Bell Button -->
  <button (click)="toggleDropdown()" class="relative p-2 rounded-full hover:bg-surface-soft transition-colors focus:outline-none">
    <svg viewBox="0 0 32 32" class="w-6 h-6 fill-none stroke-ink stroke-2"><path d="M16 4a7 7 0 0 0-7 7v7l-3 4h20l-3-4v-7a7 7 0 0 0-7-7zM12 24a4 4 0 0 0 8 0z"></path></svg>
    <!-- Badge -->
    <span *ngIf="unreadCount() > 0" class="absolute top-1 right-1 w-4 h-4 bg-primary text-canvas text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-canvas">
      {{ unreadCount() > 9 ? '9+' : unreadCount() }}
    </span>
  </button>

  <!-- Dropdown Panel -->
  <div *ngIf="isOpen()" @dropdownAnimation class="absolute right-0 mt-2 w-[360px] bg-canvas border border-hairline shadow-float rounded-2xl overflow-hidden z-[100] origin-top-right">
    <div class="flex items-center justify-between p-4 border-b border-hairline">
      <h3 class="text-[18px] font-semibold text-ink">Thông báo</h3>
      <button *ngIf="unreadCount() > 0" (click)="markAllAsRead()" class="text-[12px] text-primary hover:underline font-medium">Đánh dấu đã đọc tất cả</button>
    </div>

    <div class="max-h-[400px] overflow-y-auto hide-scrollbar">
      <div *ngIf="notifications().length === 0" class="p-6 text-center">
        <p class="text-[14px] text-muted">Bạn chưa có thông báo nào.</p>
      </div>

      <div *ngFor="let notif of notifications()" 
           class="flex gap-4 p-4 border-b border-hairline hover:bg-surface-soft transition-colors cursor-pointer relative"
           [ngClass]="!notif.isRead ? 'bg-blue-50/30' : 'bg-canvas'">
        
        <div class="w-10 h-10 rounded-full bg-surface-strong flex items-center justify-center shrink-0" [innerHTML]="getIconForType(notif.type)"></div>
        
        <div class="flex-1 pr-6">
          <h4 class="text-[14px] font-semibold mb-1" [ngClass]="!notif.isRead ? 'text-ink' : 'text-muted'">{{ notif.title }}</h4>
          <p class="text-[13px] text-muted line-clamp-2 leading-relaxed">{{ notif.message }}</p>
          <span class="text-[11px] text-muted-soft mt-2 block">{{ notif.createdAt | date:'short' }}</span>
        </div>

        <button *ngIf="!notif.isRead" (click)="markAsRead(notif.id, $event)" class="absolute right-4 top-4 w-3 h-3 bg-primary rounded-full" title="Đánh dấu đã đọc"></button>
      </div>
    </div>
    
    <div class="p-3 text-center border-t border-hairline bg-surface-soft hover:bg-hairline cursor-pointer transition-colors">
      <span class="text-[14px] font-medium text-ink">Xem tất cả thông báo</span>
    </div>
  </div>
</div>
