<div class="min-h-screen bg-surface-soft flex items-center justify-center p-4">
  <div class="bg-canvas w-full max-w-lg rounded-xl shadow-float overflow-hidden">
    <!-- Header -->
    <div class="h-16 border-b border-hairline flex items-center justify-center relative">
      <a routerLink="/" class="absolute left-6 text-ink hover:bg-surface-strong p-2 rounded-full transition-colors">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="presentation" focusable="false" style="display: block; fill: none; height: 16px; width: 16px; stroke: currentcolor; stroke-width: 3; overflow: visible;"><g fill="none"><path d="M20 28 8.7 16.7a1 1 0 0 1 0-1.4L20 4"></path></g></svg>
      </a>
      <h1 class="text-[16px] font-bold text-ink">Đăng nhập</h1>
    </div>

    <!-- Body -->
    <div class="p-8">
      <h2 class="text-[22px] font-bold text-ink mb-6">
        Chào mừng bạn đến với NexusSport
      </h2>

      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="bg-primary/10 text-primary-active p-4 rounded-md mb-6 text-[14px]">
        {{ errorMessage() }}
      </div>

      <!-- Step 1: Email & Password -->
      <form *ngIf="step() === 1" (ngSubmit)="onInitiateLogin()">
        <div class="border border-hairline rounded-lg overflow-hidden mb-4">
          <!-- Email Input -->
          <label class="block border-b border-hairline px-4 py-2 bg-canvas focus-within:outline focus-within:outline-2 focus-within:outline-ink">
            <span class="block text-[12px] font-bold text-muted">Email</span>
            <input type="email" [(ngModel)]="email" name="email" class="w-full bg-transparent border-none outline-none text-[16px] text-ink placeholder:text-muted-soft" placeholder="Email của bạn" required>
          </label>
          <!-- Password Input -->
          <label class="block px-4 py-2 bg-canvas focus-within:outline focus-within:outline-2 focus-within:outline-ink">
            <span class="block text-[12px] font-bold text-muted">Mật khẩu</span>
            <input type="password" [(ngModel)]="password" name="password" class="w-full bg-transparent border-none outline-none text-[16px] text-ink placeholder:text-muted-soft" placeholder="••••••••" required>
          </label>
        </div>

        <p class="text-[12px] text-muted mb-6">
          Chúng tôi sẽ gửi mã OTP về email của bạn để xác thực. <a href="#" class="text-ink font-semibold underline">Chính sách bảo mật</a>.
        </p>

        <button type="submit" [disabled]="isLoading()" class="w-full h-12 bg-primary hover:bg-primary-active disabled:bg-primary-disabled text-canvas font-bold text-[16px] rounded-lg transition-colors flex items-center justify-center shadow-sm">
          <span *ngIf="!isLoading()">Tiếp tục</span>
          <span *ngIf="isLoading()" class="w-5 h-5 border-2 border-canvas border-t-transparent rounded-full animate-spin"></span>
        </button>

        <!-- Divider -->
        <div class="flex items-center my-6">
          <div class="flex-1 border-b border-hairline"></div>
          <span class="px-4 text-[12px] text-muted font-semibold">hoặc</span>
          <div class="flex-1 border-b border-hairline"></div>
        </div>

        <!-- Google Auth Button (Fast Login Experience like Uber) -->
        <button type="button" class="w-full h-12 bg-canvas border border-ink hover:bg-surface-soft text-ink font-semibold text-[16px] rounded-lg transition-colors flex items-center justify-center gap-3">
          <svg viewBox="0 0 24 24" class="w-5 h-5"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path></svg>
          Tiếp tục với Google
        </button>
      </form>

      <!-- Step 2: OTP Verification -->
      <form *ngIf="step() === 2" (ngSubmit)="onCompleteLogin()">
        <div class="mb-6">
          <p class="text-[14px] text-ink mb-4">Vui lòng nhập mã OTP gồm 6 chữ số vừa được gửi đến <strong>{{ email() }}</strong></p>
          <label class="block border border-hairline rounded-lg px-4 py-2 bg-canvas focus-within:outline focus-within:outline-2 focus-within:outline-ink">
            <span class="block text-[12px] font-bold text-muted">Mã xác thực</span>
            <input type="text" [(ngModel)]="otpCode" name="otp" class="w-full bg-transparent border-none outline-none text-[18px] tracking-widest font-semibold text-ink placeholder:text-muted-soft" placeholder="------" maxlength="6" required>
          </label>
        </div>

        <button type="submit" [disabled]="isLoading()" class="w-full h-12 bg-primary hover:bg-primary-active disabled:bg-primary-disabled text-canvas font-bold text-[16px] rounded-lg transition-colors flex items-center justify-center mb-4">
          <span *ngIf="!isLoading()">Xác nhận</span>
          <span *ngIf="isLoading()" class="w-5 h-5 border-2 border-canvas border-t-transparent rounded-full animate-spin"></span>
        </button>
        
        <button type="button" (click)="step.set(1)" class="w-full h-12 bg-canvas hover:bg-surface-soft border border-hairline text-ink font-semibold text-[16px] rounded-lg transition-colors">
          Quay lại
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-hairline flex flex-col items-center gap-4">
        <p class="text-[14px] text-ink">Chưa có tài khoản? <a routerLink="/register" class="font-semibold underline">Đăng ký ngay</a></p>
      </div>
    </div>
  </div>
</div>
