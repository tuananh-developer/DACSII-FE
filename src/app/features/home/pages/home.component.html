<div class="min-h-screen bg-canvas font-sans pb-24">
  <!-- Header Nav -->
  <header class="h-20 flex items-center justify-between px-6 md:px-12 xl:px-24 border-b border-hairline bg-canvas sticky top-0 z-50">
    <a routerLink="/" class="text-primary font-bold text-2xl flex items-center gap-2 hover:opacity-80 transition-opacity">
      <svg viewBox="0 0 32 32" class="h-8 w-8 fill-current"><path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.114 12.54 7.1 14.836l.145.353c.667 1.591.91 2.472.96 3.396l.01.415.001.228c0 4.062-2.877 6.478-6.357 6.478-2.224 0-4.556-1.258-6.709-3.386l-.257-.26-.172-.179h-.011l-.176.185c-2.044 2.1-4.267 3.42-6.414 3.615l-.28.019-.267.006C5.377 31 2.5 28.584 2.5 24.522l.005-.469c.026-.928.23-1.768.83-3.244l.216-.524c.966-2.298 5.083-10.87 7.11-14.886l.528-1.038C12.53 2.016 13.982 1 16 1z"></path></svg>
      NexusSport
    </a>
    
    <div class="flex items-center gap-4 relative">
      <app-notification-dropdown></app-notification-dropdown>
      <a routerLink="/login" class="text-sm font-semibold hover:bg-surface-soft px-4 py-2 rounded-full transition-colors border border-hairline">Đăng nhập</a>
    </div>
  </header>

  <!-- Search / Filter Bar (Airbnb Style) -->
  <div class="px-6 md:px-12 xl:px-24 py-8 max-w-[1200px] mx-auto">
    <div class="border border-hairline rounded-full shadow-float bg-canvas flex flex-col md:flex-row items-center divide-y md:divide-y-0 md:divide-x divide-hairline">
      
      <!-- Khu vực (Location) -->
      <label class="flex-1 w-full md:w-auto px-6 py-3 md:py-4 hover:bg-surface-soft cursor-pointer transition-colors rounded-t-full md:rounded-l-full md:rounded-tr-none flex flex-col justify-center">
        <span class="text-[12px] font-bold text-ink mb-0.5">Khu vực</span>
        <select [(ngModel)]="searchLocation" class="w-full bg-transparent border-none outline-none text-[14px] text-muted focus:ring-0 p-0 m-0 cursor-pointer appearance-none">
          <option value="">Tất cả khu vực</option>
          <option *ngFor="let loc of locations()" [value]="loc.id">{{ loc.name }}</option>
        </select>
      </label>

      <!-- Chi nhánh (Branch) -->
      <label class="flex-1 w-full md:w-auto px-6 py-3 md:py-4 hover:bg-surface-soft cursor-pointer transition-colors flex flex-col justify-center">
        <span class="text-[12px] font-bold text-ink mb-0.5">Chi nhánh</span>
        <select [(ngModel)]="searchBranch" class="w-full bg-transparent border-none outline-none text-[14px] text-muted focus:ring-0 p-0 m-0 cursor-pointer appearance-none">
          <option value="">Tất cả chi nhánh</option>
          <option *ngFor="let branch of branches()" [value]="branch.id">{{ branch.name }}</option>
        </select>
      </label>

      <!-- Ngày (Date) -->
      <label class="flex-1 w-full md:w-auto px-6 py-3 md:py-4 hover:bg-surface-soft cursor-pointer transition-colors flex flex-col justify-center">
        <span class="text-[12px] font-bold text-ink mb-0.5">Ngày</span>
        <input type="date" [(ngModel)]="searchDate" class="w-full bg-transparent border-none outline-none text-[14px] text-muted focus:ring-0 p-0 m-0 cursor-pointer">
      </label>

      <!-- Loại sân (Type) -->
      <label class="flex-1 w-full md:w-auto px-6 py-3 md:py-4 hover:bg-surface-soft cursor-pointer transition-colors flex flex-col justify-center">
        <span class="text-[12px] font-bold text-ink mb-0.5">Loại sân</span>
        <select [(ngModel)]="searchType" class="w-full bg-transparent border-none outline-none text-[14px] text-muted focus:ring-0 p-0 m-0 cursor-pointer appearance-none">
          <option value="">Tất cả</option>
          <option *ngFor="let type of fieldTypes()" [value]="type.id">{{ type.name }}</option>
        </select>
      </label>

      <!-- Search Button -->
      <div class="px-2 py-2 md:py-0 w-full md:w-auto flex justify-center bg-canvas rounded-b-full md:rounded-r-full md:rounded-bl-none">
        <button (click)="onSearch()" class="bg-primary hover:bg-primary-active text-canvas rounded-full p-4 transition-transform active:scale-95 shadow-sm flex items-center justify-center w-full md:w-auto">
          <svg viewBox="0 0 32 32" class="w-5 h-5 fill-current stroke-current stroke-2"><path d="M13 24a11 11 0 1 0 0-22 11 11 0 0 0 0 22zm8-3l9 9"></path></svg>
          <span class="md:hidden ml-2 font-bold">Tìm kiếm</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Grid -->
  <main class="px-6 md:px-12 xl:px-24 max-w-[1440px] mx-auto">
    <div *ngIf="fieldService.isLoading()" class="flex justify-center py-20">
      <div class="w-8 h-8 border-4 border-hairline border-t-primary rounded-full animate-spin"></div>
    </div>

    <!-- Results Grid -->
    <div *ngIf="!fieldService.isLoading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 gap-y-10">
      
      <!-- Field Card -->
      <div *ngFor="let field of fieldService.fields()" class="group cursor-pointer block" [routerLink]="['/field', field.id]">
        <div class="relative w-full aspect-[20/19] rounded-2xl overflow-hidden mb-3 bg-surface-strong">
          <img [src]="field.imageUrl" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
          <!-- Heart Button Active (Liked) -->
          <button (click)="toggleSave(field, $event)" class="absolute top-3 right-3 p-2 hover:scale-110 transition-transform active:scale-90 z-10">
            <svg viewBox="0 0 32 32" class="w-6 h-6 stroke-white stroke-[2px]" [ngClass]="field.isSaved ? 'fill-primary' : 'fill-black/30'"><path d="M16 28c7-4.73 14-10 14-17a6.98 6.98 0 0 0-7-6.94c-2.87 0-5.45 1.5-6.75 4.14-1.3-2.64-3.88-4.14-6.75-4.14A6.98 6.98 0 0 0 2 11c0 7 7 12.27 14 17z"></path></svg>
          </button>
          
          <div *ngIf="field.isGuestFavorite" class="absolute top-3 left-3 bg-canvas px-2 py-1 rounded-full text-[12px] font-bold shadow-sm flex items-center gap-1">
             Được yêu thích
          </div>
        </div>

        <div class="flex justify-between items-start gap-2">
          <div>
            <h3 class="text-[15px] font-semibold text-ink line-clamp-1">{{ field.name }}</h3>
            <p class="text-[15px] text-muted line-clamp-1 mt-0.5">{{ field.address }}</p>
            <p class="text-[15px] text-muted mt-0.5">{{ field.distance }}</p>
            <p class="text-[15px] font-medium text-ink mt-2">
              ₫{{ field.price | number:'1.0-0' }} <span class="font-normal text-muted">/ giờ</span>
            </p>
          </div>
          <div class="flex items-center gap-1 shrink-0 mt-0.5">
            <svg viewBox="0 0 32 32" class="w-3 h-3 fill-ink"><path d="M15.094 1.579l-4.124 8.885-9.86 1.27a1 1 0 0 0-.542 1.736l7.293 6.565-1.965 9.852a1 1 0 0 0 1.483 1.061L16 25.951l8.625 4.997a1 1 0 0 0 1.482-1.06l-1.965-9.853 7.293-6.565a1 1 0 0 0-.541-1.735l-9.86-1.271-4.127-8.885a1 1 0 0 0-1.814 0z"></path></svg>
            <span class="text-[15px] text-ink">{{ field.rating }}</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Empty state -->
    <div *ngIf="!fieldService.isLoading() && fieldService.fields().length === 0" class="text-center py-20">
      <h3 class="text-[22px] font-semibold text-ink mb-2">Không tìm thấy sân</h3>
      <p class="text-[16px] text-muted">Vui lòng thử điều chỉnh bộ lọc tìm kiếm.</p>
    </div>

  </main>
</div>
