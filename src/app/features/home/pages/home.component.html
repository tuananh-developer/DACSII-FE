<div class="h-screen w-screen overflow-hidden bg-canvas text-ink font-sans flex flex-col md:flex-row relative">

  <!-- A. THE MAP (UBER PHILOSOPHY: Location First) -->
  <div class="absolute inset-0 z-0 bg-surface-strong">
    <!-- Mock Map Image/Iframe (You can replace this with Google Maps / Mapbox) -->
    <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2000&auto=format&fit=crop" class="w-full h-full object-cover opacity-60 grayscale" alt="Map">
    
    <!-- Marker Mockups -->
    <div class="absolute top-[30%] left-[40%] bg-ink text-canvas font-bold px-3 py-1.5 rounded-full shadow-float text-sm flex items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
      250K 
    </div>
    <div class="absolute top-[45%] left-[55%] bg-ink text-canvas font-bold px-3 py-1.5 rounded-full shadow-float text-sm flex items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
      300K 
    </div>
    <div class="absolute top-[60%] left-[30%] bg-primary text-canvas font-bold px-3 py-1.5 rounded-full shadow-float text-sm flex items-center gap-1 cursor-pointer hover:scale-110 transition-transform z-10">
      200K 
    </div>

    <!-- My Location Button (Uber style) -->
    <button class="absolute bottom-6 right-6 md:bottom-10 md:right-10 bg-canvas p-3 rounded-full shadow-float hover:bg-surface-soft transition-colors z-20">
      <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-ink"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"></path></svg>
    </button>
  </div>

  <!-- B. FLOATING SEARCH & RESULTS PANEL (AIRBNB X UBER) -->
  <div class="z-10 w-full md:w-[480px] lg:w-[540px] h-full bg-canvas shadow-[4px_0_24px_rgba(0,0,0,0.1)] flex flex-col md:h-screen absolute bottom-0 md:relative md:bottom-auto rounded-t-3xl md:rounded-none overflow-hidden max-h-[85vh] md:max-h-full transition-transform">
    
    <!-- Top Nav / Header inside Panel -->
    <div class="px-6 py-4 border-b border-hairline flex items-center justify-between shrink-0 bg-canvas">
      <div class="font-bold text-primary text-xl flex items-center gap-2">
        <svg viewBox="0 0 32 32" class="h-6 w-6 fill-current"><path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.114 12.54 7.1 14.836l.145.353c.667 1.591.91 2.472.96 3.396l.01.415.001.228c0 4.062-2.877 6.478-6.357 6.478-2.224 0-4.556-1.258-6.709-3.386l-.257-.26-.172-.179h-.011l-.176.185c-2.044 2.1-4.267 3.42-6.414 3.615l-.28.019-.267.006C5.377 31 2.5 28.584 2.5 24.522l.005-.469c.026-.928.23-1.768.83-3.244l.216-.524c.966-2.298 5.083-10.87 7.11-14.886l.528-1.038C12.53 2.016 13.982 1 16 1z"></path></svg>
        NexusSport
      </div>
      <div class="flex items-center gap-2">
        <app-notification-dropdown></app-notification-dropdown>
        <a routerLink="/login" class="text-sm font-semibold hover:bg-surface-soft px-4 py-2 rounded-full transition-colors border border-hairline">Đăng nhập</a>
      </div>
    </div>

    <!-- Search Section (Uber-like Fast Input) -->
    <div class="px-6 py-5 shrink-0 bg-canvas z-10 border-b border-hairline shadow-sm">
      <h1 class="text-2xl font-bold mb-4">Tìm sân quanh bạn</h1>
      
      <!-- Where / When / Who Stacked -->
      <div class="border border-hairline rounded-xl shadow-float overflow-hidden bg-canvas">
        
        <!-- Location -->
        <label class="flex items-center px-4 py-3 border-b border-hairline hover:bg-surface-soft cursor-text transition-colors">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-muted mr-3"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"></path></svg>
          <div class="flex-1">
            <input type="text" [(ngModel)]="searchLocation" placeholder="Khu vực hiện tại..." class="w-full bg-transparent border-none outline-none font-semibold text-ink placeholder:font-normal placeholder:text-muted focus:ring-0 p-0 m-0">
          </div>
        </label>

        <!-- Details (Date & Type) -->
        <div class="flex">
          <label class="flex-1 px-4 py-3 border-r border-hairline hover:bg-surface-soft cursor-text transition-colors flex items-center">
             <svg viewBox="0 0 24 24" class="w-5 h-5 text-muted mr-3"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"></path></svg>
             <input type="text" [(ngModel)]="searchDate" placeholder="Hôm nay" class="w-full bg-transparent border-none outline-none font-semibold text-ink placeholder:font-normal placeholder:text-muted focus:ring-0 p-0 m-0">
          </label>
          <label class="flex-1 px-4 py-3 hover:bg-surface-soft cursor-text transition-colors flex items-center">
             <svg viewBox="0 0 24 24" class="w-5 h-5 text-muted mr-3"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path></svg>
             <input type="text" [(ngModel)]="searchType" placeholder="Sân 5" class="w-full bg-transparent border-none outline-none font-semibold text-ink placeholder:font-normal placeholder:text-muted focus:ring-0 p-0 m-0">
          </label>
        </div>

      </div>
      
      <button (click)="onSearch()" class="mt-4 w-full bg-primary hover:bg-primary-active text-canvas font-bold text-base py-3.5 rounded-lg transition-transform active:scale-[0.98]">
        Tìm kiếm
      </button>
    </div>

    <!-- Scrollable Results List (Airbnb Cards) -->
    <div class="flex-1 overflow-y-auto px-6 py-4 custom-scrollbar bg-surface-soft">
      <div class="text-sm font-semibold text-ink mb-4">Hơn 50+ sân trống gần đây</div>
      
      <div class="flex flex-col gap-6 pb-12">
        <!-- Property Card Horizontal -->
        <div *ngFor="let field of fieldService.fields()" [routerLink]="['/field', field.id]" class="group cursor-pointer bg-canvas p-3 rounded-2xl shadow-sm border border-hairline-soft hover:shadow-float transition-all flex gap-4">
          
          <!-- Image -->
          <div class="relative w-32 h-32 shrink-0 rounded-xl overflow-hidden bg-surface-strong">
            <img [src]="field.imageUrl" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div *ngIf="field.isGuestFavorite" class="absolute top-2 left-2 bg-canvas px-1.5 py-0.5 rounded text-[10px] font-bold shadow-sm">
              HOT
            </div>
            <button (click)="toggleSave(field, $event)" class="absolute top-2 right-2 p-1 active:scale-90">
              <svg viewBox="0 0 32 32" class="w-5 h-5 stroke-white stroke-2" [ngStyle]="{'fill': field.isSaved ? '#ff385c' : 'rgba(0,0,0,0.5)'}"><path d="M16 28c7-4.73 14-10 14-17a6.98 6.98 0 0 0-7-6.94c-2.87 0-5.45 1.5-6.75 4.14-1.3-2.64-3.88-4.14-6.75-4.14A6.98 6.98 0 0 0 2 11c0 7 7 12.27 14 17z"></path></svg>
            </button>
          </div>

          <!-- Info -->
          <div class="flex flex-col justify-between flex-1 py-1 pr-1 overflow-hidden">
            <div>
              <div class="flex justify-between items-start mb-1">
                <h3 class="font-bold text-ink text-base truncate">{{ field.name }}</h3>
              </div>
              <p class="text-sm text-muted truncate">{{ field.address }}</p>
              <p class="text-sm font-medium text-ink mt-0.5">{{ field.distance }}</p>
            </div>
            
            <div class="flex justify-between items-end mt-2">
              <div class="flex items-center gap-1 font-semibold text-ink text-sm">
                <svg viewBox="0 0 32 32" class="w-3 h-3 fill-current"><path d="M15.094 1.579l-4.124 8.885-9.86 1.27a1 1 0 0 0-.542 1.736l7.293 6.565-1.965 9.852a1 1 0 0 0 1.483 1.061L16 25.951l8.625 4.997a1 1 0 0 0 1.482-1.06l-1.965-9.853 7.293-6.565a1 1 0 0 0-.541-1.735l-9.86-1.271-4.127-8.885a1 1 0 0 0-1.814 0z"></path></svg>
                {{ field.rating }} <span class="text-muted font-normal">({{field.reviewsCount}})</span>
              </div>
              <div class="font-bold text-ink text-[15px]">
                {{ field.price | number:'1.0-0' }}₫<span class="text-xs font-normal">/h</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
