<div class="max-w-5xl text-[#0d253d] font-sans">
  <div class="mb-8">
    <h1 class="text-[32px] font-light tracking-[-0.64px] text-[#0d253d]">Sân yêu thích</h1>
    <p class="text-[14px] text-[#64748d] mt-1">Danh sách các sân bóng bạn đã lưu lại để tham khảo sau</p>
  </div>

  <div *ngIf="isLoading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-pulse">
    <div *ngFor="let i of [1,2,3]" class="bg-white rounded-[12px] border border-[#e3e8ee] p-4 flex gap-4 h-[120px]">
      <div class="w-[80px] h-[80px] bg-[#f6f9fc] rounded-[8px]"></div>
      <div class="flex-1 py-1">
        <div class="h-4 w-3/4 bg-[#f6f9fc] rounded mb-2"></div>
        <div class="h-3 w-1/2 bg-[#f6f9fc] rounded mb-3"></div>
        <div class="h-4 w-1/3 bg-[#f6f9fc] rounded"></div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading()">
    <div *ngIf="wishlist().length === 0" class="text-center py-20 bg-white rounded-[12px] border border-[#e3e8ee] shadow-[0_1px_3px_rgba(0,55,112,0.08)]">
      <div class="w-16 h-16 bg-[#f6f9fc] rounded-full flex items-center justify-center mx-auto mb-4 border border-[#e3e8ee]">
        <svg viewBox="0 0 32 32" class="w-8 h-8 fill-[#64748d]"><path d="M16 28c7-4.73 14-10 14-17a6.98 6.98 0 0 0-7-6.94c-2.87 0-5.45 1.5-6.75 4.14-1.3-2.64-3.88-4.14-6.75-4.14A6.98 6.98 0 0 0 2 11c0 7 7 12.27 14 17z"></path></svg>
      </div>
      <h3 class="text-[18px] font-medium text-[#0d253d] mb-2">Chưa có mục yêu thích nào</h3>
      <p class="text-[14px] text-[#64748d] mb-6">Hãy nhấn vào biểu tượng trái tim khi tìm kiếm để lưu các sân bóng.</p>
      <button routerLink="/" class="bg-[#533afd] hover:bg-[#4434d4] text-white font-medium text-[14px] py-2 px-6 rounded-full transition-colors shadow-sm">Bắt đầu khám phá</button>
    </div>

    <!-- Grid Layout (Strike Style Compact Cards) -->
    <div *ngIf="wishlist().length > 0" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      
      <div *ngFor="let item of wishlist()" class="group cursor-pointer bg-white rounded-[12px] border border-[#e3e8ee] shadow-[0_1px_3px_rgba(0,55,112,0.08)] hover:shadow-[0_8px_24px_rgba(0,55,112,0.1)] transition-all p-4 flex gap-4 items-center relative" [routerLink]="['/fields', item.fieldId]">
        
        <div class="w-[80px] h-[80px] rounded-[8px] overflow-hidden bg-[#f6f9fc] shrink-0 shadow-[inset_0_0_0_1px_rgba(0,0,0,0.1)]">
          <img [src]="item.imageUrl" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
        </div>
        
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-start gap-2 mb-1">
            <h3 class="text-[15px] font-medium text-[#0d253d] line-clamp-1 group-hover:text-[#533afd] transition-colors">{{ item.name }}</h3>
            <div class="flex items-center gap-1 shrink-0 bg-[#f6f9fc] px-1.5 py-0.5 rounded-[4px]">
              <svg viewBox="0 0 32 32" class="w-3 h-3 fill-[#0d253d]"><path d="M15.094 1.579l-4.124 8.885-9.86 1.27a1 1 0 0 0-.542 1.736l7.293 6.565-1.965 9.852a1 1 0 0 0 1.483 1.061L16 25.951l8.625 4.997a1 1 0 0 0 1.482-1.06l-1.965-9.853 7.293-6.565a1 1 0 0 0-.541-1.735l-9.86-1.271-4.127-8.885a1 1 0 0 0-1.814 0z"></path></svg>
              <span class="text-[12px] font-medium text-[#0d253d] tabular-nums">{{ item.rating }}</span>
            </div>
          </div>
          
          <p class="text-[13px] text-[#64748d] line-clamp-1 mb-2">{{ item.address }}</p>
          
          <div class="text-[14px] font-medium text-[#0d253d] tabular-nums">
            ₫{{ item.price | number:'1.0-0' }} <span class="font-normal text-[#64748d]">/ giờ</span>
          </div>
        </div>

        <!-- Heart Button Active (Liked) -->
        <button (click)="removeFromWishlist(item.fieldId, $event)" class="absolute -top-3 -right-3 w-8 h-8 bg-white border border-[#e3e8ee] rounded-full shadow-sm flex items-center justify-center hover:scale-110 transition-transform group/btn">
          <svg viewBox="0 0 32 32" class="w-4 h-4 fill-[#ea2261] group-hover/btn:fill-[#d41c55]"><path d="M16 28c7-4.73 14-10 14-17a6.98 6.98 0 0 0-7-6.94c-2.87 0-5.45 1.5-6.75 4.14-1.3-2.64-3.88-4.14-6.75-4.14A6.98 6.98 0 0 0 2 11c0 7 7 12.27 14 17z"></path></svg>
        </button>

      </div>
    </div>
  </div>
</div>
