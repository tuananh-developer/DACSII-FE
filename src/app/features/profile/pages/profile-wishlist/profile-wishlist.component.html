<div class="max-w-6xl">
  <h1 class="text-[32px] font-semibold text-ink mb-6">Danh sách sân yêu thích</h1>

  <div *ngIf="isLoading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let i of [1,2,3,4]" class="animate-pulse">
      <div class="w-full aspect-square bg-surface-strong rounded-[14px] mb-3"></div>
      <div class="h-4 w-3/4 bg-surface-strong rounded mb-2"></div>
      <div class="h-3 w-1/2 bg-surface-strong rounded mb-2"></div>
      <div class="h-4 w-1/3 bg-surface-strong rounded"></div>
    </div>
  </div>

  <div *ngIf="!isLoading()">
    <div *ngIf="wishlist().length === 0" class="text-center py-16 bg-surface-soft rounded-xl border border-hairline max-w-4xl">
      <svg viewBox="0 0 32 32" class="w-12 h-12 fill-muted mx-auto mb-4"><path d="M16 28c7-4.73 14-10 14-17a6.98 6.98 0 0 0-7-6.94c-2.87 0-5.45 1.5-6.75 4.14-1.3-2.64-3.88-4.14-6.75-4.14A6.98 6.98 0 0 0 2 11c0 7 7 12.27 14 17z"></path></svg>
      <h3 class="text-[18px] font-semibold text-ink mb-2">Chưa có mục yêu thích nào</h3>
      <p class="text-[14px] text-muted mb-6">Khi bạn tìm kiếm sân bóng, hãy nhấn vào biểu tượng trái tim để lưu các sân yêu thích vào đây.</p>
      <button routerLink="/" class="bg-ink hover:bg-black text-canvas font-bold text-[14px] py-3 px-6 rounded-lg transition-transform active:scale-[0.98]">Bắt đầu khám phá</button>
    </div>

    <!-- Grid Layout (Airbnb Style Cards) -->
    <div *ngIf="wishlist().length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      
      <div *ngFor="let item of wishlist()" class="group cursor-pointer block" [routerLink]="['/fields', item.fieldId]">
        <div class="relative w-full aspect-square rounded-[14px] overflow-hidden mb-3 bg-surface-strong">
          <img [src]="item.imageUrl" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
          <!-- Heart Button Active (Liked) -->
          <button (click)="removeFromWishlist(item.fieldId, $event)" class="absolute top-3 right-3 p-2 hover:scale-110 transition-transform">
            <svg viewBox="0 0 32 32" class="w-6 h-6 fill-primary stroke-canvas stroke-[2px]"><path d="M16 28c7-4.73 14-10 14-17a6.98 6.98 0 0 0-7-6.94c-2.87 0-5.45 1.5-6.75 4.14-1.3-2.64-3.88-4.14-6.75-4.14A6.98 6.98 0 0 0 2 11c0 7 7 12.27 14 17z"></path></svg>
          </button>
        </div>
        <div class="flex justify-between items-start gap-2">
          <div>
            <h3 class="text-[14px] font-semibold text-ink line-clamp-1">{{ item.name }}</h3>
            <p class="text-[14px] text-muted line-clamp-1">{{ item.address }}</p>
            <p class="text-[14px] font-medium text-ink mt-1">
              ₫{{ item.price | number:'1.0-0' }} <span class="font-normal text-muted">/ giờ</span>
            </p>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <svg viewBox="0 0 32 32" class="w-3 h-3 fill-ink"><path d="M15.094 1.579l-4.124 8.885-9.86 1.27a1 1 0 0 0-.542 1.736l7.293 6.565-1.965 9.852a1 1 0 0 0 1.483 1.061L16 25.951l8.625 4.997a1 1 0 0 0 1.482-1.06l-1.965-9.853 7.293-6.565a1 1 0 0 0-.541-1.735l-9.86-1.271-4.127-8.885a1 1 0 0 0-1.814 0z"></path></svg>
            <span class="text-[14px] font-medium text-ink">{{ item.rating }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
